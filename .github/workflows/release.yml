name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build release binaries
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          build() {
            os="$1"; arch="$2"; out="bao-exec-${os}-${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "dist/${out}" .
          }
          build linux amd64
          build linux arm64
          build darwin arm64
          ( cd dist && shasum -a 256 bao-exec-* > "bao-exec_${version}_checksums.txt" )
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/bao-exec-linux-amd64 \
            dist/bao-exec-linux-arm64 \
            dist/bao-exec-darwin-arm64 \
            "dist/bao-exec_${GITHUB_REF_NAME#v}_checksums.txt"
